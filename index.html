<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  /* Default look. A trip's theme (trip.js) overrides any of these. */
  --ink:#1c1917;--paper:#f6f1e9;--paper2:#ede8de;--line:rgba(28,25,23,.12);--line2:rgba(28,25,23,.22);--muted:#6c655e;
  --land:#ece6d8;--coast:#bfb49c;--sea:#bcd5e1;--map-bg:var(--sea);--park:#d6e2c4;--park-edge:#8fa476;--road:#c9a86a;--river:#8fb6cc;
  --accent:#1b4878;--ok:#1a6b3c;--warn:#a16207;--bad:#b42318;
  --leg-bg:#faf8f3;--open-bg:#efece3;--where-bg:#e3ecf6;
  --display:Georgia,'Times New Roman',serif;--body:system-ui,-apple-system,'Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 var(--body);color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{border:1px solid var(--line2);border-radius:5px;background:#fff;padding:6px 8px;font-size:12.5px}

header{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--ink);color:var(--paper);flex-wrap:wrap}
.logo{font:600 18px var(--display);letter-spacing:.03em}
.logo small{opacity:.45;font-size:12px;margin-left:6px}
#trip-summary{font:600 15px var(--display)}
#trip-summary small{font:400 11px var(--body);opacity:.6;margin-left:6px}
#status{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1)}
#status[data-kind=synced]{background:#1f4d33}
#status[data-kind=offline]{background:#6b4a0c}
#status[data-kind=error]{background:#7a1f16}
.tools{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.tools button{background:none;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--paper)}
.tools button:hover{background:rgba(255,255,255,.08)}
.tools button[aria-pressed=true]{background:#3a6e9a;border-color:#3a6e9a}
#checks-btn[data-state=fail]::after,#checks-btn[data-state=warn]::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#f87171;margin-left:6px}
#checks-btn[data-state=warn]::after{background:#fbbf24}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,410px) 1fr}
.sidebar{overflow-y:auto;border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--paper2);font-size:12px;color:var(--muted)}
.bar input{flex:1;min-width:0;font-size:13px}
.paste{flex-direction:column;align-items:stretch;gap:4px}
.paste label{font-weight:500;color:var(--ink)}

.leg{border-bottom:1px solid var(--line);background:var(--leg-bg)}
.leg-head{display:flex;align-items:center;gap:10px;width:100%;padding:8px 16px;border:0;background:none;text-align:left}
.leg-head:hover{background:var(--paper2)}
.leg-icon{width:22px;text-align:center}
.leg-text{flex:1;min-width:0;display:flex;flex-direction:column;font-size:11px;color:var(--muted)}
.leg-text b{font-weight:500;color:var(--ink);font-size:12px}
.badge{font-size:10px;padding:2px 7px;border-radius:99px;background:#efe9dc;color:#7c705a;white-space:nowrap}
.badge.on{background:#d9f0e1;color:var(--ok)}
.leg-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 14px}
.leg-form label,.notes{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.leg-form .full{grid-column:1/-1}
.link{grid-column:1/-1;justify-self:start;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:11px}

.stop{border-bottom:1px solid var(--line);border-left:3px solid transparent}
.stop.open{background:var(--open-bg);border-left-color:var(--c)}
.stop.hover{background:#e7eef6}
.stop-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.num{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 12px var(--display);flex-shrink:0}
.s-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.s-name{font:600 15.5px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{font-size:11px;color:var(--muted)}
.s-sub em{font-style:normal;color:#7d6f4e;font-weight:500;margin-left:4px}
.name-in{font:600 14px var(--display);padding:3px 6px}
.region-in{font-size:11px;padding:2px 6px}
.nights{display:flex;align-items:center;flex-shrink:0}
.nights button{width:24px;height:26px;border:1px solid var(--line2);background:var(--paper)}
.nights button:first-child{border-radius:5px 0 0 5px}
.nights button:last-child{border-radius:0 5px 5px 0}
.nights input{width:34px;height:26px;border-radius:0;border-width:1px 0;padding:0;text-align:center;font:600 13px var(--display);background:var(--paper);-moz-appearance:textfield}
.nights input::-webkit-inner-spin-button{display:none}
.edit-ctl{display:flex;gap:2px}
.edit-ctl button{width:24px;height:26px;border:1px solid var(--line2);border-radius:5px;background:var(--paper);font-size:10px;color:var(--muted)}
.edit-ctl button:disabled{opacity:.35;cursor:default}
.stop-body{padding:0 16px 16px 52px}
.stop-body h4{font:600 12px var(--body);color:var(--muted);margin:12px 0 6px}
.things{list-style:none;display:flex;flex-direction:column;gap:5px}
.things li{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 6px;font-size:13px}
.things li::before{content:'';width:5px;height:5px;border-radius:50%;background:#c0b8b0;transform:translateY(-2px)}
.things li.hl{font-weight:500}
.things li.hl::before{background:var(--c)}
.things li span{flex:1 1 60%}
.tag{font-style:normal;font-size:9.5px;padding:1px 6px;border-radius:4px}
.places{list-style:none;display:flex;flex-direction:column;gap:8px}
.places li{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.side{font-style:normal;font-size:10px;color:#7c5e10;background:#fbf1d6;border-radius:4px;padding:1px 6px;white-space:nowrap;flex-shrink:0}
.pl-top{display:flex;align-items:center;gap:6px}
.pl-top a{flex:1;min-width:0;font-weight:500;color:var(--accent);text-decoration:none;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.pl-top a:hover{text-decoration:underline}
.x{border:0;background:none;color:var(--muted);width:24px;height:24px;border-radius:4px;flex-shrink:0}
.x:hover{background:#fde8e6;color:var(--bad)}
.pl-note{width:100%;margin-top:6px;border:0;border-top:1px dashed var(--line2);border-radius:0;padding:6px 0 0;font-size:12.5px;background:transparent}
.tip{margin-top:12px;padding:8px 10px;border-left:2px solid #c9a84c;background:#fdf8ec;font-size:12px;color:#6b5000}
.notes{margin-top:12px}
.notes textarea{resize:vertical;min-height:48px}
.add-stop{display:block;margin:16px;width:calc(100% - 32px);padding:10px;border:1.5px dashed var(--line2);border-radius:8px;background:none;color:var(--muted)}
.add-stop:hover{border-color:var(--accent);color:var(--accent)}

.map{position:relative;overflow:hidden;background:var(--map-bg);touch-action:none;display:flex;flex-direction:column}
#map{flex:1;min-height:0;width:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}
#land path{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke}
#pins [data-sid],#places [data-sid]{cursor:pointer}
.playbar{margin:10px 12px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 11px;background:rgba(255,255,255,.95);border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px}
.playbar button,.zoom button{min-width:28px;height:28px;border:1px solid var(--line2);border-radius:6px;background:var(--paper)}
#play[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#day{flex:1;min-width:40px;accent-color:var(--accent);padding:0;border:0;background:none}
#day-label{min-width:0;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px}
.zoom button{padding:0 9px;font-size:12px}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:8px;padding:8px 11px;font-size:11px;display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.dot{width:8px;height:8px;border-radius:50%;margin:0 10px 0 4px;background:#888;border:1.5px solid #fff}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:6px;font-size:12px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .1s;white-space:nowrap}
#tip.on{opacity:1}
@keyframes bob{50%{transform:translateY(-4px)}}
.bob{animation:bob .9s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob{animation:none}}

dialog{margin:auto;border:0;border-radius:12px;padding:20px;width:min(460px,92vw);background:var(--paper);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:color-mix(in srgb,var(--ink) 45%,transparent)}
dialog h3{font:600 18px var(--display)}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
dialog textarea.json{min-height:200px;font:11px ui-monospace,monospace}
.muted{color:var(--muted);font-size:12.5px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.actions button{padding:7px 14px;border-radius:6px;border:1px solid var(--line2);background:var(--paper)}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.checks{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:58vh;overflow:auto}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:1px 8px;font-size:12.5px}
.checks li::before{font-weight:700;text-align:center}
.checks .pass::before{content:'✓';color:var(--ok)}
.checks .warn::before{content:'!';color:var(--warn)}
.checks .fail::before{content:'✕';color:var(--bad)}
.checks .info::before{content:'i';color:var(--muted)}
.checks small{grid-column:2;color:var(--muted)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:7px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:12px}
#toast button{border:1px solid rgba(255,255,255,.35);background:none;color:var(--paper);border-radius:5px;padding:3px 10px;font-size:12px}
.pl-toggle{display:flex;align-items:center;gap:8px;width:100%;margin:14px 0 6px;padding:7px 10px;border:1px solid var(--line2);border-radius:7px;background:#fff;text-align:left}
.pl-toggle b{font-weight:600;font-size:12.5px}
.pl-counts{flex:1;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:10px;color:var(--muted);transition:transform .15s}
.pl-toggle[aria-expanded=true] .chev{transform:rotate(180deg)}
.stop-body h5{font:600 11.5px var(--body);color:var(--ink);margin:10px 0 5px}
.pl-meta{display:flex;gap:6px;margin-top:5px}
.pl-meta select{font-size:11px;padding:2px 4px;flex:1;min-width:0}
.things li .x{width:20px;height:20px;font-size:10px;opacity:.55}
.things li .x:hover{opacity:1}

.tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:7px;padding:3px}
.tabs button{border:0;background:none;color:color-mix(in srgb,var(--paper) 65%,transparent);border-radius:5px;padding:4px 11px;font-size:12.5px}
.tabs button[aria-pressed=true]{background:var(--paper);color:var(--ink);font-weight:500}
.tabs small{opacity:.6;margin-left:4px}
.ideas{display:none;flex:1;min-height:0;overflow-y:auto;padding:18px clamp(12px,3vw,32px) 40px}
body[data-page=ideas] .app{visibility:hidden;position:fixed;inset:0;z-index:-1;pointer-events:none}   /* kept laid out so map checks still work */
body[data-page=ideas] .ideas{display:block}
.ideas-bar{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;max-width:1200px}
.ideas-bar input[type=search]{max-width:360px;font-size:13px;padding:7px 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:3px 11px;font-size:12px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-lbl{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px;min-width:44px}
.ideas-sum{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;max-width:1200px}
.idea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
.idea.is-hidden{opacity:.5}
.idea-tags{display:flex;flex-wrap:wrap;gap:4px}
.idea-tags span{font-size:10.5px;padding:1px 7px;border-radius:4px;background:var(--paper2);color:var(--muted)}
.idea-tags .where{background:var(--where-bg);color:var(--accent);font-weight:500}
.idea h3{font:600 15px/1.3 var(--display)}
.idea p{font-size:12.5px;color:color-mix(in srgb,var(--ink) 82%,var(--paper));line-height:1.45}
.idea-items{list-style:none;display:flex;flex-direction:column;gap:4px;border-top:1px dashed var(--line2);padding-top:7px}
.idea-items li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.idea-items li > span{flex:1;min-width:0}
.plus{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:1px solid var(--accent);background:#fff;color:var(--accent);font-size:17px;line-height:1}
.plus:hover{background:var(--accent);color:#fff}
.inplan{font-size:11px;color:var(--ok);font-weight:500;white-space:nowrap}
.idea footer{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px;font-size:11.5px;color:var(--muted)}
.idea footer a{color:var(--accent);text-decoration:none}
.idea footer a:hover{text-decoration:underline}
.idea footer .hide{margin-left:auto;border:0;background:none;color:var(--muted);font-size:11.5px;text-decoration:underline}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
  .map{order:-1}
  .sidebar{border-right:0;border-top:1px solid var(--line)}
  .legend{display:none}
  header{gap:6px 10px;padding:8px 12px}
  .logo small{display:none}
  .tools{margin-left:0;width:100%;flex-wrap:nowrap;overflow-x:auto}
  .tools button{white-space:nowrap}
  #day-label{max-width:none;flex-basis:100%}
}

/* Basemap layers */
#land path.park{fill:var(--park);stroke:var(--park-edge);stroke-width:1.1}
#water path{fill:var(--sea);stroke:color-mix(in srgb,var(--sea) 70%,var(--ink));stroke-width:.4;vector-effect:non-scaling-stroke}
#rivers path{fill:none;stroke:var(--river);stroke-width:1;vector-effect:non-scaling-stroke}
#roads path{fill:none;stroke:var(--road);stroke-width:1.3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#labels text{pointer-events:none;paint-order:stroke;stroke:color-mix(in srgb,var(--land) 80%,#fff);font-family:var(--display)}
#labels .lbl-park{fill:color-mix(in srgb,var(--park-edge) 55%,var(--ink));font-weight:600;letter-spacing:.02em}
#labels .lbl-water{fill:color-mix(in srgb,var(--sea) 35%,var(--ink));font-style:italic;stroke:var(--sea)}
#labels .lbl-region{fill:var(--muted);letter-spacing:.12em;font-weight:500}
#trip-switch{background:none;color:var(--paper);border-color:rgba(255,255,255,.25);font-size:12px;padding:3px 6px}
#trip-switch option{color:var(--ink)}
.boot-error{padding:40px;max-width:560px;font:15px/1.5 system-ui,sans-serif}

</style>
</head>
<body>
<header>
  <div class="logo"><span id="trip-title">Trip planner</span><small id="trip-sub"></small></div>
  <select id="trip-switch" aria-label="Switch trip" hidden></select>
  <nav class="tabs" aria-label="Pages">
    <button data-action="page" data-v="plan" aria-pressed="true">Plan</button>
    <button id="ideas-tab" data-action="page" data-v="ideas" aria-pressed="false">Ideas<small id="ideas-count"></small></button>
  </nav>
  <div id="trip-summary"></div>
  <div id="status" data-kind="local" role="status"></div>
  <div class="tools">
    <button id="edit-btn" data-action="toggle-edit" aria-pressed="false">Edit stops</button>
    <button id="checks-btn" data-action="checks">Checks</button>
    <button data-action="copy">Copy plan</button>
    <button data-action="import">Load plan</button>
    <button data-action="reset">Reset</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="bar">
      <span>Start date</span>
      <input type="date" id="start-date" data-bind="startDate" data-rerender style="flex:0 1 auto">
      <span id="end-date"></span>
    </div>
    <div class="bar paste">
      <label for="paste-in">Add a place</label>
      <input id="paste-in" placeholder="Paste a Google Maps link, then press Enter" autocomplete="off">
    </div>
    <div id="stops"></div>
    <button class="add-stop" data-action="add-stop">+ Add a stop</button>
  </aside>

  <main class="map">
    <div class="playbar">
      <button data-action="step" data-d="-1" aria-label="Previous day">‹</button>
      <button id="play" data-action="play" aria-pressed="false" aria-label="Play through the trip">▶</button>
      <input type="range" id="day" min="1" max="1" value="1" aria-label="Trip day">
      <button data-action="step" data-d="1" aria-label="Next day">›</button>
      <span id="day-label">Scrub through the trip day by day</span>
    </div>
    <svg id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the trip route">
      <g id="land"></g>
      <g id="water"></g>
      <g id="rivers"></g>
      <g id="roads"></g>
      <g id="labels"></g>
      <g id="routes"></g>
      <g id="places"></g>
      <g id="pins"></g>
    </svg>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button data-action="zoom" data-f="0.7" aria-label="Zoom in">+</button>
      <button data-action="zoom" data-f="1.4" aria-label="Zoom out">−</button>
      <button data-action="fit">Whole trip</button>
    </div>
    <div id="tip"></div>
  </main>
</div>

<section class="ideas" id="ideas" aria-label="Ideas from saved posts">
  <div class="ideas-bar">
    <input type="search" id="idea-q" placeholder="Search ideas" aria-label="Search ideas">
    <div class="chips" id="idea-where"></div>
    <div class="chips" id="idea-what"></div>
  </div>
  <p class="ideas-sum" id="ideas-sum"></p>
  <div class="idea-grid" id="idea-grid"></div>
</section>

<dialog id="place-dlg">
  <form method="dialog">
    <h3>Add a place</h3>
    <p id="place-info" class="muted"></p>
    <label>Name<input id="pl-name" required></label>
    <label>Add to<select id="pl-stop"></select></label>
    <label>Category<select id="pl-cat"></select></label>
    <label>Note<textarea id="pl-note" rows="2" placeholder="What is it, and why go?"></textarea></label>
    <div class="actions"><button value="cancel" formnovalidate>Cancel</button><button value="add" class="primary">Add place</button></div>
  </form>
</dialog>

<dialog id="import-dlg">
  <form method="dialog">
    <h3>Load a plan</h3>
    <p class="muted">Paste plan text from “Copy plan”. This replaces the current plan<span class="shared-note"> for everyone sharing it</span>.</p>
    <textarea id="import-text" class="json" placeholder="Paste plan text here"></textarea>
    <div class="actions"><button value="cancel" formnovalidate>Cancel</button><button value="load" class="primary">Load plan</button></div>
  </form>
</dialog>

<dialog id="checks-dlg">
  <form method="dialog">
    <h3>Checks</h3>
    <p id="checks-sum" class="muted"></p>
    <ul class="checks" id="checks-list"></ul>
    <div class="actions"><button value="close" class="primary">Close</button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script>
// Picks the trip from ?trip=<folder> (default: the first in config.js), then loads its map
// and plan, then the planner. The #trip=<code> part of the address is the sharing code.
(function () {
  const cfg = window.PLANNER_CONFIG || {}, list = cfg.trips || [];
  const id = new URLSearchParams(location.search).get('trip') || (list[0] && list[0].id) || '';
  const fail = msg => { document.body.innerHTML = `<div class="boot-error"><h2>This trip didn’t load</h2><p>${msg}</p></div>`; };
  if (!/^[a-z0-9][a-z0-9-]*$/.test(id)) return fail('No trip is set up yet. Add a folder under <code>trips/</code> and list it in <code>config.js</code>.');
  window.TRIP_ID = id;
  const load = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(src); document.body.appendChild(s); });
  load(`trips/${id}/basemap.js`).then(() => load(`trips/${id}/trip.js`)).then(() => load('planner.js'))
    .catch(src => fail(`Couldn’t load <code>${src.replace(/</g, '&lt;')}</code>. Check the trip name in the address matches a folder in <code>trips/</code>.`));
})();
</script>
</body>
</html>
